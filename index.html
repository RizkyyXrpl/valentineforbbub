<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine for bubub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .album {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        .memory {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .photo {
            width: 40%;
            border-radius: 10px;
            margin-right: 20px;
        }
        .text {
            width: 60%;
        }
        .hidden-gem {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        .choices button {
            margin: 10px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .yes {
            background-color: #e63946;
            color: white;
        }
        .no {
            background-color: #ccc;
            color: black;
            position: absolute;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="album">
        <h2>Happy Valentine Byubub💖</h2>
        
        <div class="memory">
            <div class="text">
                <h3>Foto Pertama</h3>
                <p>Pertama kali kita fotobar menuju hari terakhir kita sekelas</p>
                <p>＞︿＜</p>
            </div>
            <img src="1.jpg" class="photo" alt="Kenangan 1">
        </div>
        
        <div class="memory">
            <img src="2.jpg" class="photo" alt="Kenangan 2">
            <div class="text">
                <h3>Foto kemarin</h3>
                <p>dan ini kita setelah hampir 3 tahun barengg. 💕</p>
            </div>
        </div>

        <h1 onclick="showHiddenGem()">???</h1>
        
        <div class="hidden-gem" id="hiddenGem">
            <h3>Kamu suka sayang aku??</h3>
            <div class="choices">
                <button class="yes" onclick="showLocation()">Sayanggg</button>
                <button class="no" id="noButton" onclick="moveButton()">Ga Ah</button>
            </div>
            <p id="location" class="hidden-gem">Klik <a href="https://maps.app.goo.gl/BYkYgFApPrKrKrQf9">di sini</a> buat ketemu aku! 💕</p>
        </div>
    </div>

    <script>
        function showHiddenGem() {
            document.getElementById("hiddenGem").style.display = "block";
        }

        function showLocation() {
            document.getElementById("location").style.display = "block";
        }

        function moveButton() {
            let btn = document.getElementById("noButton");
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 50);
            btn.style.left = `${x}px`;
            btn.style.top = `${y}px`;
        }
    </script>
</body>
</html>
